'use strict';
// ================= PIXEL MOTORS — core =================
const W = 384, H = 216;
const view = document.getElementById('game');
const vctx = view.getContext('2d');
const RES = 2; // internal render resolution multiplier: world stays 384x216 logical, vehicles get 2x detail
const buf = document.createElement('canvas'); buf.width = W * RES; buf.height = H * RES;
const ctx = buf.getContext('2d');
ctx.setTransform(RES, 0, 0, RES, 0, 0);
ctx.imageSmoothingEnabled = false;
let T = ctx; // current paint target
let SCALE = 1, OFFX = 0, OFFY = 0;
let NOW = 0; // seconds since start
const TAU = Math.PI * 2;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = window.innerWidth, ch = window.innerHeight;
  view.width = Math.round(cw * dpr); view.height = Math.round(ch * dpr);
  view.style.width = cw + 'px'; view.style.height = ch + 'px';
  let s = Math.min(view.width / W, view.height / H);
  if (s >= 3) s = Math.floor(s);
  SCALE = s;
  OFFX = Math.round((view.width - W * s) / 2);
  OFFY = Math.round((view.height - H * s) / 2);
}
window.addEventListener('resize', resize);
resize();

// ---------- math / rng ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

const pick = a => a[Math.floor(Math.random() * a.length)];
function mulberry(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0; let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);

    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

}

// ---------- colors ----------
const _rgbCache = {};
function rgb(hex) {
  let c = _rgbCache[hex]; if (c) return c;
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  c = [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  _rgbCache[hex] = c; return c;
}
const toHex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
function mix(a, b, t) { const A = rgb(a), B = rgb(b); return toHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }

  if (amt < 0) return mix(mix(hex, '#2a1f4a', -amt * 0.5), '#0b0b18', -amt * 0.6);
  return mix(mix(hex, '#fff6d0', amt * 0.7), '#ffffff', amt * 0.3);
}

// ---------- primitive painting (crisp, no AA) ----------
function paint(cv, fn) { const prev = T; T = cv.getContext('2d'); T.imageSmoothingEnabled = false; fn(T); T = prev; }

function rect(x, y, w, h, c) { T.fillStyle = c; T.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function px(x, y, c) { T.fillStyle = c; T.fillRect(Math.round(x), Math.round(y), 1, 1); }
function hline(x, y, w, c) { rect(x, y, w, 1, c); }

function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  T.fillStyle = c;
  let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
  for (let i = 0; i < 2000; i++) {
    T.fillRect(x0, y0, 1, 1);
    if (x0 === x1 && y0 === y1) break;

    if (e2 <= dx) { err += dx; y0 += sy; }

}
// scanline polygon; col may be a function(y)->color
function poly(pts, col) {

  for (const p of pts) { if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1]; }

  const n = pts.length;
  for (let y = minY; y < maxY; y++) {
    const sy = y + 0.5, xs = [];
    for (let i = 0; i < n; i++) {

      const x0 = Math.round(xs[i]), x1 = Math.round(xs[i + 1]);

}
function disc(cx, cy, r, c) {

  for (let dy = -r; dy <= r; dy++) {
    const w = Math.floor(Math.sqrt(r * r - dy * dy + r * 0.8));

  }
}
function ellipse(cx, cy, rx, ry, c) {
  T.fillStyle = c;
  for (let dy = -ry; dy <= ry; dy++) {
    const w = Math.floor(rx * Math.sqrt(Math.max(0, 1 - (dy * dy) / ((ry + .5) * (ry + .5)))));

  }
}
function dither(x, y, w, h, c, phase = 0, density = 2) {

function blit(img, x, y, sx, sy, sw, sh) {

}
function blitScaled(img, x, y, s) { T.drawImage(img, Math.round(x), Math.round(y), img.width * s, img.height * s); }

// ---------- input ----------
const input = {

  downX: 0, downY: 0, upX: 0, upY: 0, dragged: false, dragDX: 0, primary: null,
  keys: {}, kp: {}, lastX: 0, usedTouch: false, taps: [],
};
function toLogical(e) {
  const r = view.getBoundingClientRect();
  const dpr = view.width / r.width;
  return [((e.clientX - r.left) * dpr - OFFX) / SCALE, ((e.clientY - r.top) * dpr - OFFY) / SCALE];
}
view.addEventListener('pointerdown', e => {
  e.preventDefault(); audio.unlock();
  if (e.pointerType === 'touch') input.usedTouch = true;
  const [x, y] = toLogical(e);
  input.ptrs.set(e.pointerId, { x, y });
  input.taps.push({ x, y });
  try { view.setPointerCapture(e.pointerId); } catch (_) { }
  if (input.primary === null) {
    input.primary = e.pointerId; input.down = true; input.pressed = true;
    input.downX = x; input.downY = y; input.x = x; input.y = y; input.lastX = x; input.dragged = false;
  }
});
view.addEventListener('pointermove', e => {
  const [x, y] = toLogical(e);
  if (input.ptrs.has(e.pointerId)) input.ptrs.set(e.pointerId, { x, y });
  if (input.primary === null || input.primary === e.pointerId) {
    input.x = x; input.y = y;
    if (input.down && Math.hypot(x - input.downX, y - input.downY) > 6) input.dragged = true;
  }
});
function ptrUp(e) {
  const [x, y] = toLogical(e);
  input.ptrs.delete(e.pointerId);
  if (input.primary === e.pointerId) {
    input.primary = null; input.down = false; input.released = true; input.upX = x; input.upY = y;
    if (e.pointerType === 'touch') { input.x = -100; input.y = -100; }
  }
}
view.addEventListener('pointerup', ptrUp);
view.addEventListener('pointercancel', ptrUp);
view.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (typeof _codeBox !== 'undefined' && _codeBox) return;
  audio.unlock();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ShiftLeft', 'ShiftRight', 'Tab'].includes(e.code)) e.preventDefault();
  if (!e.repeat) input.kp[e.code] = true;
  input.keys[e.code] = true;
});
window.addEventListener('keyup', e => { input.keys[e.code] = false; });
window.addEventListener('blur', () => { input.keys = {}; });
const key = (...codes) => codes.some(c => input.keys[c]);
const keyP = (...codes) => codes.some(c => input.kp[c]);

// ---------- scenes & transitions ----------
let scene = null, nextScene = null, transT = 0, transDir = 0;
function go(s) {
  if (transDir !== 0) return;
  nextScene = s; transDir = 1; transT = 0;
}
function goNow(s) { scene = s; s.enter && s.enter(); }
function drawTransition() {
  if (!transDir) return;
  const p = transDir === 1 ? transT : 1 - transT;
  const cell = 16;
  T.fillStyle = '#07070d';
  for (let y = 0; y < H; y += cell) for (let x = 0; x < W; x += cell) {
    const d = (x / W) * 0.5 + (y / H) * 0.25;
    const k = clamp((p * 1.75 - d) * 1.6, 0, 1);
    const s = Math.ceil(k * cell);
    if (s > 0) T.fillRect(x + (cell - s) / 2 | 0, y + (cell - s) / 2 | 0, s, s);
  }

function updateTransition(dt) {
  if (!transDir) return;

    else { transDir = 0; transT = 0; }

const PAL = {
  ink: '#0b0c14', panel: '#1b1e2e', panel2: '#242840', edge: '#3b4268', hi: '#5a6494', text: '#e8ecff', dim: '#8d96c2',

  cash: '#7cf07a', rep: '#ffd23f',

  modal: null, inModal: false, toasts: [], hoverAny: false, consumed: false,

function inRect(x, y, r) { return x >= r[0] && y >= r[1] && x < r[0] + r[2] && y < r[1] + r[3]; }

}

function panel(x, y, w, h, o = {}) {
  const fill = o.fill || PAL.panel;

  rect(x + 1, y + 1, w - 2, h - 2, o.edge || PAL.edge);
  rect(x + 2, y + 2, w - 4, h - 4, fill);
  hline(x + 2, y + 2, w - 4, shade(fill, 0.12));

    rect(x + 2, y + 2, w - 4, 11, o.titleCol || PAL.panel2);
    hline(x + 2, y + 13, w - 4, PAL.ink);
    hline(x + 2, y + 2, w - 4, shade(o.titleCol || PAL.panel2, 0.2));

  }
  // corner rivets

// button: returns true when clicked
function button(label, x, y, w, h, o = {}) {
  const dis = !!o.disabled;

  const hov = !dis && hovering(x, y, w, h);
  const prs = !dis && pressing(x, y, w, h);
  if (hov) ui.hoverAny = true;
  const top = prs ? 1 : 0;
  rect(x, y, w, h, PAL.ink);
  const face = prs ? shade(base, -0.15) : hov ? shade(base, 0.12) : base;
  rect(x + 1, y + 1 + top, w - 2, h - 2 - top, shade(base, -0.45));
  rect(x + 1, y + 1 + top, w - 2, h - 3 - (prs ? 0 : 1), face);
  hline(x + 2, y + 1 + top, w - 4, shade(face, 0.3));
  if (o.selected) { frame(x - 1, y - 1, w + 2, h + 2, PAL.yellow); }
  const tc = dis ? '#7d8099' : (o.textCol || '#ffffff');
  let cx = x + w / 2, cy = y + Math.floor((h - (o.s || 1) * 7) / 2) + top - (prs ? 0 : 1) + 1;
  if (o.icon && label) {
    const tw = measure(label, o.s || 1) + 11;
    icon(o.icon, cx - tw / 2, y + Math.floor((h - 8) / 2) + top, tc);
    text(label, cx - tw / 2 + 11, cy, tc, { s: o.s || 1, shadow: shade(face, -0.5) });
  } else if (o.icon) {
    icon(o.icon, cx - 4, y + Math.floor((h - 8) / 2) + top, tc);

}

function drawToasts(dt) {
  let y = 160 - ui.toasts.length * 15;
  for (const t of ui.toasts) {
    t.t += dt;
    const a = t.t < 0.2 ? t.t / 0.2 : t.t > 2.4 ? 1 - (t.t - 2.4) / 0.4 : 1;
    if (a <= 0) continue;
    const w = measure(t.msg) + 14;
    const x = Math.round(W / 2 - w / 2 + (1 - Math.min(1, a)) * 0);

    text(t.msg, x + 7, y + 3, t.col);

// modal dialog: {title, lines:[], buttons:[{label,col,cb}], draw?:fn(x,y,w,h)}
function dialog(d) { ui.modal = d; d.t = 0; }
function closeDialog() { ui.modal = null; }

  const d = ui.modal; if (!d) return;

  const w = d.w || 220;
  const lines = [];

  const h = d.h || (32 + lines.length * 10 + (d.extraH || 0) + 26);

  ui.inModal = true;
  panel(x, y, w, h, { title: d.title, titleCol: d.titleCol });
  lines.forEach((l, i) => text(l, x + 10, y + 20 + i * 10, d.lineCol || PAL.text));
  if (d.draw) d.draw(x, y + 20 + lines.length * 10, w, d.extraH || 0);
  const bs = d.buttons || [{ label: 'OK' }];
  const bw = Math.min(90, (w - 16 - (bs.length - 1) * 6) / bs.length);
  const tot = bs.length * bw + (bs.length - 1) * 6;
  bs.forEach((b, i) => {
    if (button(b.label, Math.round(x + w / 2 - tot / 2 + i * (bw + 6)), y + h - 22, Math.round(bw), 16, { col: b.col || PAL.blue, disabled: b.disabled })) {
      if (!b.keep) closeDialog();

class RaceCar {

    this.et = 0; this.top = 0; this.spin = false; this.limiterT = 0; this.rot = 0; this.acc = 0; this.pending = 0; this.flame = 0;

    else if (rpm < lo - 350) { this.bogT = 0.9 * cf; this.bogF = 1 - (0.5 - 0.45 * clamp(rpm / lo, 0, 1) + 0.05) * cf; this.lq = 'BOGGED DOWN'; }

    this.shiftT = this.p.shiftT * (q === 'PERFECT' ? 0.6 : 1);

    if (this.launched && this.nosLeft > 0 && this.nosT <= 0 && this.gear >= 2 && this.shiftT <= 0 && Math.random() < dt * 0.8) this.useNos();
  }

    }
    let cut = 1;
    if (this.rpm >= p.rl) { this.rpm = p.rl; this.limiterT += dt; cut = (Math.floor(this.limiterT * 24) % 2) ? 0.05 : 0.6; if (Math.random() < 0.2) this.flame = 0.05; }
    else this.limiterT = 0;
    const x = clamp(this.rpm / p.rl, 0.15, 1);
    let P = p.hp * 745.7 * powerFrac(x, p.ev, p.diesel);
    if (p.turbo) { const target = x > 0.45 ? 1 : x / 0.45 * 0.35; this.boost += (target - this.boost) * clamp(dt * 2.2, 0, 1); P *= 0.68 + 0.32 * this.boost; }
    if (this.nosT > 0) { this.nosT -= dt; P *= 1.38; }
    if (this.shiftT <= 0 && gas && !this.finished) F = P * cut / (Math.max(this.rpm, 1000) * TAU / 60) * ratio * 0.9 / p.r;
    if (this.bogT > 0) { this.bogT -= dt; F *= this.bogF; }
    const cap = this.spinT > 0 ? p.traction * 0.72 : p.traction;
    this.spin = false;
    if (F > cap) { F = cap * (this.spinT > 0 ? 1 : 0.96); this.spin = true; }
    if (this.spinT > 0) { this.spinT -= dt; this.spin = true; }
    const drag = 0.6 * p.cda * this.v * this.v + (this.v > 0.1 ? 0.015 * p.wt * 9.81 : 0) + (this.finished ? (MODELS[this.car && this.car.model] && MODELS[this.car.model].chute ? 12 : 6) * p.wt : 0);
    const a = (F - drag) / p.wt;
    this.acc = a;
    this.v = Math.max(0, this.v + a * dt);
    this.x += this.v * dt;
    this.top = Math.max(this.top, this.v);
    this.rot += (this.v * dt / (TAU * 0.32)) * 8 + (this.spin ? dt * 30 : 0);
  }
}

// ---------------- AUCTION BIDDING ----------------
function auctionScene(lot) {
  const value = carValue(lot);
  const inc = Math.max(100, Math.round(value * 0.04 / 100) * 100);
  const names = ['Mr. Grant', 'Lady V', 'Big Tony', 'Dr. Kato', 'Ms. Ruiz', 'Old Pete', 'Chen W.', 'Rocco'];
  const bidders = [0, 1, 2].map(i => ({ name: names[(Math.random() * names.length) | 0] + '', max: value * rnd(0.55, 1.2) * (i === 0 ? 1.05 : 1), react: 0, raised: 0, shirt: pick(['#2f6ae0', '#3fa34d', '#a36bff', '#d23a3a', '#e5d8ac']), x: 40 + i * 120 }));
  let bid = lot.start, high = null, timer = 5, t = 0, ended = false, phase = '', msgT = 0, lastBidBy = '';
  const call = () => timer > 3.3 ? '' : timer > 1.8 ? 'GOING ONCE...' : timer > 0.4 ? 'GOING TWICE...' : 'LAST CALL!';
  function place(who) {
    if (high === null) bid = lot.start; else bid += inc;
    high = who; timer = 4.2; msgT = 1; audio.sfx('bid');
    lastBidBy = who === 'you' ? 'YOU' : who.name;
    if (who !== 'you') who.raised = 1;
  }
  return {
    enter() { audio.playMusic('garage'); },
    update(dt) {
      t += dt; msgT -= dt;
      if (ended) return;
      timer -= dt;
      for (const b of bidders) {
        b.raised = Math.max(0, b.raised - dt);
        if (high !== b && bid + inc <= b.max) { b.react += dt; if (b.react > 0.6 + Math.random() * 1.6 + (timer < 1.5 ? -0.5 : 0)) { b.react = 0; place(b); break; } }
        else b.react = 0;
      }
      if (timer <= 0) {
        ended = true; audio.sfx('gavel');
        S.market.auction = S.market.auction.filter(c => c !== lot);

          if (buyCar(lot, bid)) {
            phase = 'won'; S.rep += 3; S.flags.auction = 1; checkAch();

          } else { phase = 'fail'; dialog({ title: 'DEAL FELL THROUGH', lines: ['You could not pay or had no space. The lot went to the next bidder.'], buttons: [{ label: 'OK', cb: () => go(marketScene('auction')) }] }); }
        } else {
          phase = 'lost';
          dialog({ title: high ? 'SOLD!' : 'NO SALE', lines: [high ? 'Sold to ' + high.name + ' for ' + fmt$(bid) + '.' : 'Nobody bid on this lot.'], buttons: [{ label: 'BACK TO LOTS', cb: () => go(marketScene('auction')) }] });
        }
        saveGame();
      }

    draw() {

      drawCar(lot, 70, 178, { s: 2, rot: Math.floor(t * 2) });
      // auctioneer
      person(314, 110, { shirt: '#1c1d24', pants: '#1c1d24', hair: '#8a8a90' }, 0, true);
      rect(300, 112, 40, 38, '#4a2c1a'); rect(298, 108, 44, 6, '#6a4228'); hline(298, 108, 44, '#8a5a34'); rect(310, 120, 20, 12, '#d4a733'); text('$', 320, 122, '#14151b', { align: 'center' });
      if (msgT > 0 || call()) {
        const msg = msgT > 0 ? fmt$(bid) + '!  ' + lastBidBy : call();
        const w = measure(msg) + 10; rect(316 - w, 86, w, 13, '#f2f2f6'); frame(316 - w, 86, w, 13, '#14151b'); poly([[306, 99], [312, 99], [312, 104]], '#f2f2f6');
        text(msg, 321 - w, 89, '#14151b');
      }
      // crowd foreground
      for (let i = 0; i < 26; i++) { const x = i * 15 - 4, y = 196 + (i % 2) * 3; disc(x + 6, y - 6, 5, '#0a0910'); rect(x, y - 2, 13, 20, '#0a0910'); }
      bidders.forEach(b => {
        disc(b.x + 6, 190, 6, '#15131c'); rect(b.x - 1, 195, 15, 20, b.shirt);
        const up = b.raised > 0 ? 18 : 0;
        if (up) { vline(b.x + 14, 172, 18, '#d6d0c0'); rect(b.x + 10, 162, 10, 10, '#f2f2f6'); text(String(bidders.indexOf(b) + 1), b.x + 15, 164, '#14151b', { align: 'center' }); }
        text(b.name, b.x + 6, 205, high === b ? PAL.yellow : '#8a90b0', { align: 'center' });
      });
      // panel
      panel(4, 32, 132, 92, { title: 'LOT: ' + carName(lot) });
      text('CURRENT BID', 10, 48, PAL.dim); text(fmt$(bid), 10, 57, PAL.cash, { s: 2 });
      text('HIGH: ' + (high === null ? '-' : high === 'you' ? 'YOU' : high.name), 10, 74, high === 'you' ? PAL.green : '#e8ecff');

      drawHUD();

// ================= REPAIR: component jobs with interactive mini-games =================
function repairScene(car) {
  let t = 0, mg = null, shake = 0;
  const comps = () => COMPS.filter(c => car.comp[c.id] !== undefined);
  function startJob(c, useKit) {
    const cost = useKit ? 0 : repairCost(car, c.id);
    if (!useKit && S.cash < cost) { toast('NOT ENOUGH CASH', PAL.red); audio.sfx('error'); return; }
    if (useKit) S.kits[c.id]--; else S.cash -= cost;
    const finish = (ok) => {
      if (!ok) { if (useKit) S.kits[c.id]++; else S.cash += cost; mg = null; toast('JOB CANCELLED - REFUNDED', PAL.dim); return; }

// ---------------- DYNO & TUNING ----------------
function dynoScene(car) {
  car.tune = car.tune || { fd: 1, boost: 1 };
  let run = -1, t = 0, eng = null, et = null, etKey = '', peak = null;
  const tuneKey = () => JSON.stringify(car.tune);
  function curve(p) {
    const pts = [];
    for (let rpm = 1000; rpm <= p.rl; rpm += p.rl / 60) { const x = rpm / p.rl; const hp = p.hp * powerFrac(x, p.ev, p.diesel) * (p.turbo ? (x > 0.45 ? 1 : 0.68 + 0.32 * x / 0.45 * 0.35) : 1); pts.push({ rpm, hp, tq: hp * 5252 / rpm }); }
    return pts;
  }
  return {
    enter() { audio.playMusic('garage'); },
    leave() { if (eng) { eng.stop(); eng = null; } },
    update(dt) {
      t += dt;
      if (run >= 0) {
        run += dt / 4;
        const p = perf(car);
        if (eng) eng.set(1000 + (p.rl - 1000) * Math.min(1, run), 1, p.cyl, p.turbo ? Math.min(1, run * 1.5) : 0, 0);
        if (run >= 1.15) { run = -1; if (eng) { eng.stop(); eng = null; } audio.sfx('good'); const c = curve(p); peak = c.reduce((a, b) => b.hp > a.hp ? b : a); ev('dyno'); }
      }
      if (etKey !== tuneKey() && !input.down) { etKey = tuneKey(); et = perf(car).issue ? null : estimateET(car, 402); }
    },
    draw() {
      dimGarage(0.45);
      const p = perf(car);
      const spin = run >= 0 ? Math.floor(t * 60 * Math.min(1, run + 0.2)) : 0;
      // dyno rollers
      for (const wx of [MODELS[car.model].xr, MODELS[car.model].xf]) { rect(6 + wx * 2 - 20, 168, 40, 10, '#1a1b22'); disc(6 + wx * 2 - 9, 168, 8, '#3a3d47'); disc(6 + wx * 2 + 9, 168, 8, '#3a3d47'); px(6 + wx * 2 - 9 + Math.cos(t * 30 * (run >= 0)) * 6, 168 + Math.sin(t * 30 * (run >= 0)) * 6, '#9aa0ae'); }
      rect(0, 172, 214, 6, '#2a2d38'); hline(0, 172, 214, '#4a4e5a');
      drawCar(car, 6, 158, { s: 2, rot: spin, bounce: run >= 0 && Math.floor(t * 30) % 2 ? -1 : 0, noShadow: true });
      text(carName(car), 8, 36, '#e8ecff'); text(p.hp + ' HP  ' + (p.ev ? 'ELECTRIC' : p.cyl + ' CYL') + (p.turbo ? ' TURBO' : ''), 8, 45, PAL.orange);
      // graph
      panel(214, 32, 168, 106, { title: 'DYNO SHEET' });
      const gx = 226, gy = 50, gw = 148, gh = 74;
      rect(gx, gy, gw, gh, '#0c0e16'); for (let i = 1; i < 4; i++) hline(gx, gy + gh * i / 4, gw, '#1a1e2e'); for (let i = 1; i < 6; i++) vline(gx + gw * i / 6, gy, gh, '#1a1e2e');
      const c = curve(p), maxHp = Math.max(...c.map(q => q.hp)) * 1.1, maxTq = Math.max(...c.map(q => q.tq)) * 1.1;
      const lim = run >= 0 ? Math.min(1, run) : peak ? 1 : 0;
      let prev = null, prevT = null;
      for (const q of c) {
        const f = (q.rpm - 1000) / (p.rl - 1000); if (f > lim) break;
        const x = gx + f * (gw - 1), y = gy + gh - 1 - q.hp / maxHp * (gh - 2), y2 = gy + gh - 1 - q.tq / maxTq * (gh - 2);
        if (prev) { line(prev[0], prev[1], x, y, PAL.yellow); line(prevT[0], prevT[1], x, y2, '#4aa8ff'); }
        prev = [x, y]; prevT = [x, y2];
      }
      text('HP', gx + 2, gy + 2, PAL.yellow); text('TORQUE', gx + 18, gy + 2, '#4aa8ff');
      text('RPM', gx + gw, gy + gh + 2, PAL.dim, { align: 'right' });
      if (run >= 0) text(Math.round(1000 + (p.rl - 1000) * Math.min(1, run)) + ' RPM', gx + gw / 2, gy + 30, '#e8ecff', { align: 'center', shadow: true });
      else if (peak) text('PEAK ' + Math.round(peak.hp) + 'HP @ ' + Math.round(peak.rpm / 100) * 100, gx + gw / 2, gy + gh + 2, PAL.green, { align: 'center' });
      else text('PRESS RUN DYNO', gx + gw / 2, gy + 32, PAL.dim, { align: 'center' });
      // tuning

      const fdv = slider('GEARING', 220, 156, 158, (car.tune.fd - 0.85) / 0.3);
      car.tune.fd = Math.round((0.85 + fdv * 0.3) * 100) / 100;
      if (p.turbo) { const bv = slider('BOOST', 220, 168, 158, (car.tune.boost - 0.85) / 0.4); car.tune.boost = Math.round((0.85 + bv * 0.4) * 100) / 100; }
      else text('NO TURBO - BOOST N/A', 220, 168, '#4a4f6a');
      text('1/4: ' + (et ? et.toFixed(2) + 'S' : '-'), 220, 180, PAL.yellow); text(car.tune.fd > 1 ? 'SHORT GEARS: LAUNCH' : car.tune.fd < 1 ? 'TALL GEARS: TOP SPEED' : 'STOCK GEARS', 376, 180, PAL.dim, { align: 'right' });
      if (button(run >= 0 ? 'RUNNING...' : 'RUN DYNO', 8, 180, 90, 16, { col: run >= 0 ? '#4a4f6a' : PAL.red, icon: 'gauge' in ICONS ? 'gauge' : 'bolt' }) && run < 0) {

    },
  };
}

    S.codes = S.codes || {};
    if (!c) { msg.style.color = '#e8434b'; msg.textContent = 'INVALID CODE'; audio.sfx('error'); return; }
    if (code === 'COINS' && S.codes.COINS && !S.codes.COINS100) { const add = S.codes.COINS10 ? 90000000 : 99000000; S.codes.COINS10 = S.codes.COINS100 = S.day; S.cash += add; saveGame(); audio.sfx('cash'); toast('CODE UPGRADED: +' + fmt$(add) + ' (NOW $100M TOTAL)', PAL.green); close(); return; }
    if (S.codes[code]) { msg.style.color = '#ff8a2a'; msg.textContent = 'CODE ALREADY USED'; audio.sfx('error'); return; }
    S.codes[code] = S.day; if (code === 'COINS') S.codes.COINS10 = S.day; c.give(); saveGame(); checkAch();
    audio.sfx('cash'); toast('CODE REDEEMED: ' + c.desc, PAL.green);
    close();
  };
  setTimeout(() => inp.focus(), 30);
}

}
</script></body></html>
